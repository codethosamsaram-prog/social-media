name: reel-pipeline

# 6 posts a day (IST): 5 dev reels + 1 "hiring in India" reel at 13:00.
# GitHub cron is UTC (IST = UTC+5:30) and can start a few minutes late under load.
on:
  schedule:
    - cron: "30 2 * * *"     # 08:00 IST  dev reel
    - cron: "30 5 * * *"     # 11:00 IST  dev reel
    - cron: "30 7 * * *"     # 13:00 IST  HIRING reel
    - cron: "30 9 * * *"     # 15:00 IST  dev reel
    - cron: "30 12 * * *"    # 18:00 IST  dev reel
    - cron: "30 15 * * *"    # 21:00 IST  dev reel
  workflow_dispatch:
    inputs:
      item_id:
        description: "Queue item id (blank = next queued)"
        required: false
      kind:
        description: "dev or hiring"
        required: false
        default: "dev"
      dry_run:
        description: "true = render only: post nothing, save nothing"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency: reel-pipeline

env:
  DAY_ONE: "2026-11-04"      # Day 1 of the streak; nothing is posted before this date

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WHISPER_MODEL: base
      KIND: ${{ github.event.inputs.kind || (github.event.schedule == '30 7 * * *' && 'hiring' || 'dev') }}
    steps:
      - name: Wait for Day 1
        id: gate
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [[ "$today" < "$DAY_ONE" ]]; then echo "Before $DAY_ONE (today $today): skipping"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-render.txt
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/cache@v4
        if: steps.gate.outputs.go == 'true'
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/remotion
            assets/fonts
            assets/stock
          key: reel-assets-v2
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          # ffmpeg for Whisper; the rest are the shared libraries Remotion's headless Chrome needs.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-render.txt
          (cd video && npm ci)

      - name: Discover
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "$KIND" = "hiring" ]; then python hiring.py; else python topic_fetcher.py --limit 2; fi

      - name: Render + publish
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python auto_pipeline.py --no-publish
          elif [ -n "${{ github.event.inputs.item_id }}" ]; then
            python auto_pipeline.py --id "${{ github.event.inputs.item_id }}"
          elif [ "$KIND" = "hiring" ]; then
            python auto_pipeline.py --category hiring
          else
            python auto_pipeline.py
          fi

      - name: Commit queue
        if: always() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add topics_queue.json
          git diff --cached --quiet || git commit -m "chore(queue): update after $KIND reel run"
          git pull --rebase --autostash && git push

      # Vercel holds a snapshot of the queue, so the dashboard and DM keywords update only on deploy.
      - name: Update dashboard
        if: always() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN: skipping"; exit 0; fi
          npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'true'
        with:
          name: reels-${{ github.run_id }}
          path: output/*/reel.mp4
          retention-days: 7

      - name: Alert on failure
        if: failure() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/alert-issue.sh "Reel run failed" "A $KIND reel did not post. The log shows why."
