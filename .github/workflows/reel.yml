name: reel-pipeline

# 6 posts a day (IST): 2 DSA, 2 interview concepts, 1 quiz, 1 "hiring in India" reel. Slots are in slot_gate.py.
# This wakes every 15 minutes and posts only if today is behind, so a late or dropped GitHub schedule
# or a failed run is made up by the next tick. A tick with nothing to do ends in seconds.
# Runs start up to 30 minutes before a slot and hold the post until the slot time.
# cron-job.org also ticks this through workflow_dispatch with gated=true, since GitHub's schedule runs late.
on:
  schedule:
    - cron: "2,17,32,47 2-18 * * *"     # about 07:32 to 00:17 IST; dense because GitHub runs some late and skips others
  workflow_dispatch:
    inputs:
      item_id:
        description: "Queue item id (blank = next queued)"
        required: false
      kind:
        description: "dsa, interview, quiz, hiring, or dev (= any)"
        required: false
        default: "dev"
      dry_run:
        description: "true = render only: post nothing, save nothing"
        required: false
        default: "false"
      gated:
        description: "true = act like a scheduled tick: post only if a reel is due"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency: reel-pipeline

env:
  DAY_ONE: "2026-11-04"      # Day 1 of the streak

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WHISPER_MODEL: base
    steps:
      # By default a run checks out the commit from when it was triggered. A run that waited for the
      # concurrency lock would then see an old queue and post the reel that just went up.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-render.txt

      # Runs inside the concurrency lock, so a tick that waited for a running reel sees that reel's post.
      - name: Is a reel due?
        id: gate
        env:
          MANUAL_KIND: ${{ github.event.inputs.kind }}
          GATED: ${{ github.event.inputs.gated }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GATED" != "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "kind=${MANUAL_KIND:-dev}" >> "$GITHUB_OUTPUT"
          else
            pip install -q httpx
            python slot_gate.py
          fi

      - name: Set reel kind
        if: steps.gate.outputs.go == 'true'
        run: |
          echo "KIND=${{ steps.gate.outputs.kind }}" >> "$GITHUB_ENV"
          echo "POST_NOT_BEFORE=${{ steps.gate.outputs.post_at }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/cache@v4
        if: steps.gate.outputs.go == 'true'
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/remotion
            assets/fonts
            assets/stock
          key: reel-assets-v2
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          # ffmpeg for Whisper; the rest are the shared libraries Remotion's headless Chrome needs.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-render.txt
          (cd video && npm ci)

      # New topics are a bonus: the queue has a backlog, so a dead source must not stop today's post.
      - name: Discover
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          if [ "$KIND" = "hiring" ]; then python hiring.py; else python topic_fetcher.py --limit 2; fi

      - name: Render + publish
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python auto_pipeline.py --no-publish
          elif [ -n "${{ github.event.inputs.item_id }}" ]; then
            python auto_pipeline.py --id "${{ github.event.inputs.item_id }}"
          elif [ -n "$KIND" ] && [ "$KIND" != "dev" ]; then
            python auto_pipeline.py --category "$KIND"
          else
            python auto_pipeline.py
          fi

      - name: Commit queue
        if: always() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add topics_queue.json
          git diff --cached --quiet || git commit -m "chore(queue): update after $KIND reel run"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      # Vercel holds a snapshot of the queue, so the dashboard and DM keywords update only on deploy.
      # A failure here doesn't touch posting, so it doesn't fail the run.
      - name: Update dashboard
        if: always() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN: skipping"; exit 0; fi
          npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        with:
          name: reels-${{ github.run_id }}
          path: output/*/reel.mp4
          retention-days: 7

      - name: Alert on failure
        if: failure() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/alert-issue.sh "Reel run failed" "A reel did not post. The next tick retries; the log shows why this one failed."

      - name: Clear the alert
        if: success() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/alert-issue.sh --clear "Reel run failed"
